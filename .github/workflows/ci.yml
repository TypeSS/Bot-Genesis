name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build shared packages
        run: pnpm packages:build

      - name: Build bot
        run: pnpm bot:build

      - name: Build dashboard
        run: pnpm dashboard:build

      - name: Typecheck bot
        run: pnpm --filter @genesis/bot typecheck

      - name: Lint dashboard
        run: pnpm --filter @genesis/dashboard lint

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build --pull
